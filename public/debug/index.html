<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F5F1">
<title>Debug — viewport</title>
<style>
html,body{margin:0;background:#F6F5F1;font:15px/1.45 -apple-system,system-ui,sans-serif;color:#1E1E1E}
.mark{position:fixed;left:0;right:0;height:6px;z-index:9}
.mark.t{top:0;background:#CF453A}.mark.b{bottom:0;background:#2a6df4}
.sa{position:fixed;left:0;width:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px)}
main{padding:24px 20px}
pre{white-space:pre-wrap;word-break:break-all;background:#fff;border:1px solid #E2DACB;border-radius:10px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace}
.tall{height:1400px;background:linear-gradient(#F6F5F1,#ECECEC)}
.end{background:#1E1E1E;color:#F6F5F1;padding:16px 20px}
</style>
</head>
<body>
<div class="mark t"></div><div class="mark b"></div><div class="sa" id="sa"></div>
<main>
<h1 style="margin:0 0 8px;font-size:22px">Viewport check</h1>
<p style="margin:0 0 12px">Screenshot this screen at the top, and once more scrolled to the very bottom. Red line = top of the page window, blue line = bottom.</p>
<pre id="out">…</pre>
</main>
<div class="tall"></div>
<div class="end">End of page (dark block). Anything below this is outside the page.</div>
<script>
function v() {
  var sa = document.getElementById('sa').getBoundingClientRect(), vv = window.visualViewport || {};
  var d = {
    userAgent: navigator.userAgent,
    telegramProxy: typeof window.TelegramWebviewProxy !== 'undefined',
    telegramObj: typeof window.Telegram !== 'undefined',
    webkitHandlers: !!(window.webkit && window.webkit.messageHandlers),
    standalone: !!navigator.standalone,
    innerWH: innerWidth + ' x ' + innerHeight,
    clientH: document.documentElement.clientHeight,
    visualViewport: vv.height ? Math.round(vv.width) + ' x ' + Math.round(vv.height) + ' offsetTop ' + Math.round(vv.offsetTop) : 'n/a',
    screen: screen.width + ' x ' + screen.height + ' dpr ' + devicePixelRatio,
    safeAreaTop: Math.round(sa.top),
    safeAreaBottom: Math.round(innerHeight - sa.bottom),
    scrollY: Math.round(scrollY) + ' / ' + (document.documentElement.scrollHeight - innerHeight)
  };
  document.getElementById('out').textContent = Object.keys(d).map(function (k) { return k + ': ' + d[k]; }).join('\n');
}
v(); addEventListener('scroll', v, { passive: true }); addEventListener('resize', v);
if (window.visualViewport) visualViewport.addEventListener('resize', v);
</script>
</body>
</html>
